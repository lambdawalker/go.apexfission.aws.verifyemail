name: Verify email verification feature
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/...
      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Unformatted Go files:\n%s\n' "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi
  native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: infrastructure/go.mod
          cache-dependency-path: infrastructure/go.sum
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
